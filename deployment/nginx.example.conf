# Inside an isolated deployment network. Replace both domain and backend address.
# Configure actual TLS certificates in your hosting environment; this file is a fragment.
limit_req_zone $binary_remote_addr zone=cortex_requests:10m rate=5r/s;
server {
    listen 443 ssl;
    server_name cortex.example.org;
    # ssl_certificate /path/to/your/fullchain.pem;
    # ssl_certificate_key /path/to/your/privkey.pem;
    client_max_body_size 64k;
    client_body_timeout 10s;
    location / {
        limit_req zone=cortex_requests burst=10 nodelay;
        proxy_pass http://cortex:8765;
        proxy_set_header Host cortex.example.org;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
