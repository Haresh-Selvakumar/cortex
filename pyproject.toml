[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-cortex"
version = "0.2.0"
description = "A budgeted, verified agent-governance research scaffold"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cortex = "cortex.app_cli:main"

[tool.setuptools.packages.find]
include = ["cortex*"]

[tool.setuptools.package-data]
cortex = ["web_assets/*", "default_config/*.json"]
